  <script>
   const zodiacSigns = {
            '牡羊座': { start: [3, 21], end: [4, 19], emoji: '♈', element: 'fire' },
            '牡牛座': { start: [4, 20], end: [5, 20], emoji: '♉', element: 'earth' },
            '双子座': { start: [5, 21], end: [6, 21], emoji: '♊', element: 'air' },
            '蟹座': { start: [6, 22], end: [7, 22], emoji: '♋', element: 'water' },
            '獅子座': { start: [7, 23], end: [8, 22], emoji: '♌', element: 'fire' },
            '乙女座': { start: [8, 23], end: [9, 22], emoji: '♍', element: 'earth' },
            '天秤座': { start: [9, 23], end: [10, 23], emoji: '♎', element: 'air' },
            '蠍座': { start: [10, 24], end: [11, 22], emoji: '♏', element: 'water' },
            '射手座': { start: [11, 23], end: [12, 21], emoji: '♐', element: 'fire' },
            '山羊座': { start: [12, 22], end: [1, 19], emoji: '♑', element: 'earth' },
            '水瓶座': { start: [1, 20], end: [2, 18], emoji: '♒', element: 'air' },
            '魚座': { start: [2, 19], end: [3, 20], emoji: '♓', element: 'water' }
        };

        function getZodiacSign(month, day) {
            for (const [sign, data] of Object.entries(zodiacSigns)) {
                const [startMonth, startDay] = data.start;
                const [endMonth, endDay] = data.end;

                if (startMonth === endMonth) {
                    if (month === startMonth && day >= startDay && day <= endDay) {
                        return { sign, ...data };
                    }
                } else {
                    if ((month === startMonth && day >= startDay) || 
                        (month === endMonth && day <= endDay)) {
                        return { sign, ...data };
                    }
                }
            }
            return null;
        }

        function generateFortune(zodiacSign, year) {
            const fortunes = {
                '2026': {
                    '牡牛座': {
                        overall: '2026年は変化と成長の年になりそうです。特に春から夏にかけて、新しいチャンスや出会いが訪れる可能性があります。自分の価値観を大切にしながらも、柔軟な姿勢で物事に取り組むことで、良い結果につながるでしょう。',
                        work: 'キャリアにおいて重要な転機が訪れるかもしれません。これまでの努力が評価される時期です。新しいプロジェクトや責任あるポジションを任される可能性もあります。',
                        love: '人間関係が深まる年です。パートナーがいる方は絆が強まり、シングルの方は意外なところで素敵な出会いがあるかもしれません。',
                        money: '安定した金運ですが、衝動買いには注意が必要です。長期的な視点での資産管理を心がけると良いでしょう。',
                        health: 'ストレス管理が重要です。適度な運動やリラックスする時間を意識的に取り入れることで、心身ともに健やかに過ごせます。',
                        luckyColor: 'ブルー、ゴールド',
                        luckyNumber: '3、7'
                    }
                }
            };

            const defaultFortune = {
                overall: `2026年は${zodiacSign}の方にとって、新たな可能性が広がる一年となるでしょう。前向きな姿勢を持ち続けることで、素晴らしい出会いやチャンスに恵まれます。`,
                work: '仕事面では新しい挑戦の機会が訪れます。自分の強みを活かしながら、積極的に取り組むことで良い結果が得られるでしょう。',
                love: '愛情運は良好です。素直な気持ちを大切にすることで、人間関係がより豊かになります。',
                money: '計画的な金銭管理を心がけることで、安定した運気を保てます。大きな出費の前には慎重な検討を。',
                health: '心身のバランスを意識することが大切です。適度な休息と運動を取り入れて、健康的な生活を心がけましょう。',
                luckyColor: 'ホワイト、シルバー',
                luckyNumber: '2、9'
            };

            return fortunes[year]?.[zodiacSign] || defaultFortune;
        }

        function getFortune() {
            const month = parseInt(document.getElementById('birthMonth').value);
            const day = parseInt(document.getElementById('birthDay').value);
            const year = '2026';

            if (!month || !day) {
                alert('誕生日の月と日を選択してください');
                return;
            }

            const zodiacData = getZodiacSign(month, day);
            if (!zodiacData) {
                alert('誕生日の取得に失敗しました');
                return;
            }

            const fortune = generateFortune(zodiacData.sign, year);

            const resultHTML = `
                <div class="zodiac-header">
                    <div class="emoji">${zodiacData.emoji}</div>
                    <h2>${zodiacData.sign}</h2>
                    <p>${month}月${day}日生まれ | ${year}年の運勢</p>
                </div>

                <div class="fortune-section">
                    <h3>🌟 全体運</h3>
                    <p>${fortune.overall}</p>
                </div>

                <div class="fortune-section">
                    <h3>💼 仕事運</h3>
                    <p>${fortune.work}</p>
                </div>

                <div class="fortune-section">
                    <h3>💕 恋愛運</h3>
                    <p>${fortune.love}</p>
                </div>

                <div class="fortune-section">
                    <h3>💰 金運</h3>
                    <p>${fortune.money}</p>
                </div>

                <div class="fortune-section">
                    <h3>🏃 健康運</h3>
                    <p>${fortune.health}</p>
                </div>

                <div class="lucky-items">
                    <div class="lucky-item">
                        <h4>ラッキーカラー</h4>
                        <p>${fortune.luckyColor}</p>
                    </div>
                    <div class="lucky-item">
                        <h4>ラッキーナンバー</h4>
                        <p>${fortune.luckyNumber}</p>
                    </div>
                </div>

                <button class="btn back-btn" onclick="resetForm()">もう一度占う</button>
            `;

            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('result').innerHTML = resultHTML;
            document.getElementById('result').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('result').innerHTML = '';
        }

        function updateDays() {
            const month = parseInt(document.getElementById('birthMonth').value);
            const daySelect = document.getElementById('birthDay');
            
            daySelect.innerHTML = '<option value="">日</option>';
            
            if (!month) return;
            
            const daysInMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            const maxDays = daysInMonth[month - 1];
            
            for (let i = 1; i <= maxDays; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i + '日';
                daySelect.appendChild(option);
            }
        }

window.onload = function() {
    document.getElementById('birthMonth').addEventListener('change', updateDays);
    
    // 今日の日付を取得
    const today = new Date();
    const currentMonth = today.getMonth() + 1; // 月は0始まりなので+1
    const currentDay = today.getDate();
    
    // 今日の日付を設定
    document.getElementById('birthMonth').value = currentMonth;
    updateDays();
    document.getElementById('birthDay').value = currentDay;
};
